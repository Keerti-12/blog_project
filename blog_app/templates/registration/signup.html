<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f7f4ef;
        --ink: #161616;
        --muted: #5f5b57;
        --accent: #e04f1c;
        --card: #ffffff;
        --line: #e5ded4;
        --shadow: 0 18px 40px rgba(22, 22, 22, 0.15);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Work Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(1000px 600px at 10% -10%, #fbe7d2, transparent 60%),
          radial-gradient(900px 500px at 100% 10%, #d7efe8, transparent 55%),
          var(--bg);
        min-height: 100vh;
      }
      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 28px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      h1 {
        font-family: "Fraunces", serif;
        margin: 0 0 10px;
        font-size: 30px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      form {
        display: grid;
        gap: 14px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font-size: 14px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
        border: 1px solid transparent;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .meta {
        margin-top: 16px;
        font-size: 14px;
      }
      .meta a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Create your account</h1>
        <p>Join the community and start sharing your posts.</p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn">Sign up</button>
        </form>
        <div class="meta">
          Already have an account? <a href="{% url 'login' %}">Login</a>
        </div>
      </div>
    </div>
  </body>
</html>
