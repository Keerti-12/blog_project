<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ post.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f7f4ef;
        --ink: #161616;
        --muted: #5f5b57;
        --accent: #e04f1c;
        --card: #ffffff;
        --line: #e5ded4;
        --shadow: 0 18px 40px rgba(22, 22, 22, 0.15);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Work Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(1000px 600px at 10% -10%, #fbe7d2, transparent 60%),
          radial-gradient(900px 500px at 100% 10%, #d7efe8, transparent 55%),
          var(--bg);
        min-height: 100vh;
      }
      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 28px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .title {
        font-family: "Fraunces", serif;
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 44px);
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 20px;
      }
      .media {
        border-radius: 20px;
        overflow: hidden;
        background: #f3efe8;
        margin-bottom: 20px;
      }
      .media img {
        width: 100%;
        height: auto;
        display: block;
      }
      .content {
        line-height: 1.7;
        font-size: 16px;
        color: var(--ink);
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1 class="title">{{ post.title }}</h1>
        <div class="meta">By {{ post.author.username }} · {{ post.created_at }}</div>
        {% if post.image %}
          <div class="media">
            <img src="{{ post.image.url }}" alt="Post image">
          </div>
        {% endif %}
        <div class="content">{{ post.content }}</div>
        <a href="{% url 'home' %}" class="btn">Back to home</a>
      </div>
    </div>
  </body>
</html>
